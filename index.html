.card{border-radius:18px}

.global-filters{display:flex;gap:6px;overflow-x:auto;padding:3px 1px 9px;scrollbar-width:thin}.global-filter{flex:0 0 auto;border:1px solid #e0e7f2;background:#f8fafc;color:#475467;border-radius:999px;padding:7px 11px;font-size:12px}.global-filter.on{background:#eef2ff;border-color:#a5b4fc;color:#4338ca}.global-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.global-result{min-width:0;border:1px solid #edf0f5;border-radius:10px!important;padding:11px!important;white-space:normal}.global-result:hover{background:#f8faff}@media(max-width:480px){.global-result-grid{grid-template-columns:1fr}}

/* ---------- login ---------- */
async function signIn(){
  const err = $("lerr"), btn = $("lbtn");
  err.textContent = "";
  if (!window.supabase) {
    err.textContent = "Supabase library failed to load. Check your internet connection and reload this page.";
    return;
  }
  if (!configReady || !sb) {
    err.textContent = "Supabase is not configured. Edit SUPABASE_URL and SUPABASE_ANON_KEY near the top of this file.";
    return;
  }
  const email = $("em").value.trim(), password = $("pw").value;
  if (!email || !password) { err.textContent = "Enter your email and password."; return; }
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      console.error("Supabase sign-in error:", error);
      const msg = String(error.message || "");
      if (/invalid login credentials/i.test(msg)) err.textContent = t("wrong");
      else if (/email not confirmed/i.test(msg)) err.textContent = "Please confirm this email address in Supabase before signing in.";
      else err.textContent = "Login failed: " + (msg || "Unknown Supabase error");
      return;
    }
    if (data && data.session) showSession(data.session);
  } catch (e) {
    console.error("Sign-in request failed:", e);
    err.textContent = "Could not contact Supabase. Check the project URL, network connection, and browser console.";
  } finally {
    btn.disabled = false; btn.textContent = t("log_in");
  }
}
async function signOut(){
  if (!sb) return;
  const { error } = await sb.auth.signOut();
  if (error) alert(t("error") + ": " + error.message);
}

function scheduleForAttendance(a,teacherId){
  const hour=String(a.hour||"").slice(0,5);
  if(a.group_id){
    return S.schedule.find(x=>x.group_id===a.group_id&&x.teacher_id===teacherId&&String(x.start_time||"").slice(0,5)===hour)||null;
  }
  // Legacy attendance rows may not contain group_id. Infer only when one class uniquely matches.
  const student=S.students.find(s=>s.id===a.student_id);
  const eligible=S.schedule.filter(x=>x.teacher_id===teacherId&&groupIds(student||{}).includes(x.group_id)&&String(x.start_time||"").slice(0,5)===hour);
  return eligible.length===1?eligible[0]:null;
}

V.students=()=>{

  const month=today().slice(0,7);

  return{head:`<div class="admin-welcome"><div><h2 style="margin:0;font-size:21px;letter-spacing:-.03em">Students</h2><p>Keep track of enrolments, classes and payments at a glance.</p></div>${addBtn("students","add_student")}</div>${searchBox()}<div class="row noprint">${tools("exportStudents")}</div>`,
  body:`<div class="admin-grid"><div class="admin-stat"><div class="stat-label">Total students</div><div class="stat-value">${S.students.length}</div><div class="mu">Across all groups</div></div><div class="admin-stat"><div class="stat-label">Active students</div><div class="stat-value">${active}</div><div class="mu">Currently enrolled</div></div><div class="admin-stat"><div class="stat-label">Assigned to groups</div><div class="stat-value">${assigned}</div><div class="mu">${S.students.length-assigned} without a group</div></div><div class="admin-stat"><div class="stat-label">Payments this month</div><div class="stat-value" style="font-size:23px">${money(paidThisMonth)}</div><div class="mu">Recorded payments</div></div></div><div class="page-summary"><span class="summary-chip">Showing <strong>${l.length}</strong> of ${S.students.length} students</span><span class="summary-chip">Fees are calculated from attendance where available</span></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Student</th><th>Groups</th><th>Subjects</th><th>Monthly fee</th><th>Paid this month</th><th>Balance</th><th>Phone</th><th>Status</th><th>Payment</th><th class="noprint">Actions</th></tr></thead><tbody>${l.map(s=>{const paid=S.payments.filter(p=>p.student_id===s.id&&String(p.paid_on||"").startsWith(month)).reduce((a,p)=>a+(Number(p.amount)||0),0);const due=Math.max(0,(Number(s.monthly_fee)||0)-paid);return `<tr><td><b>${esc(full(s))}</b>${s.dob?`<div class="mu">${t("born")} ${esc(s.dob)}</div>`:""}</td><td>${groupIds(s).map(id=>`<span class="tag">${esc(nm(S.groups,id))}</span>`).join(" ")||"<span class=\"mu\">Unassigned</span>"}</td><td>${esc(subjNames(s)||"—")}</td><td>${money(Number(s.monthly_fee)||0)}</td><td>${money(paid)}</td><td><b>${money(due)}</b></td><td>${tel(s.phone)||"—"}</td><td><span class="tag ${s.active?"ok":"bad"}">${t(s.active?"active":"not_active")}</span></td><td><span class="tag ${paid>0?"ok":""}">${paid>0?"Paid recorded":"No payment"}</span></td><td class="noprint">${eb("students",s.id)}</td></tr>`}).join("")||`<tr><td colspan="10" class="table-empty">${none(S.students.length?"no_results":"no_students")}</td></tr>`}</tbody></table></div>`};
};
V.groups=()=>{
  const selected=S.groups.find(g=>g.id===selectedGroupId);
  if(selected){
    const students=S.students.filter(s=>groupIds(s).includes(selected.id)).sort((a,b)=>full(a).localeCompare(full(b)));
    const classes=S.schedule.filter(x=>x.group_id===selected.id).sort((a,b)=>a.day-b.day||String(a.start_time||"").localeCompare(String(b.start_time||"")));
    const days=DAYS();
    return{head:`<div class="row"><button class="sec" onclick="selectedGroupId='';render()">← All groups</button><button class="pri" onclick="openForm('students')">+ Add student to this group</button><button class="sec" onclick="openForm('groups','${selected.id}')">Edit group</button></div>`,body:`<div class="admin-welcome"><div><h2 style="margin:0;font-size:22px">${esc(selected.name)}</h2><p>Group overview, enrolled students and scheduled classes.</p></div><span class="group-count-pill">${students.length} students</span></div><div class="admin-grid"><div class="admin-stat"><div class="stat-label">Students in group</div><div class="stat-value">${students.length}</div><div class="mu">Enrolled in this group</div></div><div class="admin-stat"><div class="stat-label">Active students</div><div class="stat-value">${students.filter(s=>s.active).length}</div><div class="mu">Currently active</div></div><div class="admin-stat"><div class="stat-label">Teachers</div><div class="stat-value" style="font-size:18px">${esc(grpTeachers(selected.id)||"—")}</div><div class="mu">Assigned through schedule</div></div><div class="admin-stat"><div class="stat-label">Scheduled classes</div><div class="stat-value">${classes.length}</div><div class="mu">Classes and subjects</div></div></div><div class="card tbl-wrap"><h3>Students in ${esc(selected.name)} <span class="group-count-pill">${students.length}</span></h3><table class="tbl"><thead><tr><th>Student</th><th>Phone</th><th>Other groups</th><th>Status</th><th class="noprint">Actions</th></tr></thead><tbody>${students.map(s=>`<tr><td><b>${esc(full(s))}</b>${s.dob?`<div class="mu">Born ${esc(s.dob)}</div>`:""}</td><td>${tel(s.phone)||"—"}</td><td>${esc(groupIds(s).filter(id=>id!==selected.id).map(id=>nm(S.groups,id)).filter(x=>x!=="—").join(", ")||"—")}</td><td><span class="tag ${s.active?"ok":"bad"}">${t(s.active?"active":"not_active")}</span></td><td class="noprint">${eb("students",s.id)}</td></tr>`).join("")||`<tr><td colspan="5" class="table-empty">No students assigned to this group yet. Use “Add student” to enrol someone.</td></tr>`}</tbody></table></div><div class="card tbl-wrap"><h3>Classes and subjects</h3><table class="tbl"><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Teacher</th><th>Teacher pay/student present</th><th>Student fee/class</th></tr></thead><tbody>${classes.map(x=>`<tr><td>${esc(days[x.day]||"—")}</td><td>${esc(x.start_time||"—")}–${esc(x.end_time||"—")}</td><td>${esc(nm(S.subjects,x.subject_id))}</td><td>${esc(nm(S.teachers,x.teacher_id))}</td><td>${money(x.teacher_rate??(S.teachers.find(q=>q.id===x.teacher_id)||{}).price_per_session??0)}</td><td>${money(x.student_fee||0)}</td></tr>`).join("")||`<tr><td colspan="6" class="table-empty">No classes scheduled for this group yet.</td></tr>`}</tbody></table></div>`};
  }
  const l=S.groups.filter(g=>hit(Q.groups,g.name,grpTeachers(g.id),S.students.filter(s=>groupIds(s).includes(g.id)).map(full).join(" ")));
  const assignedCount=S.students.filter(s=>groupIds(s).length).length;
  const totalSeats=S.groups.reduce((n,g)=>n+S.students.filter(s=>groupIds(s).includes(g.id)).length,0);
  return{head:`<div class="admin-welcome"><div><h2 style="margin:0;font-size:21px;letter-spacing:-.03em">Groups</h2><p>Explore each group, check enrolment and open its student list.</p></div>${addBtn("groups","add_group")}</div>${searchBox()}`,
  body:`<div class="admin-grid"><div class="admin-stat"><div class="stat-label">Total groups</div><div class="stat-value">${S.groups.length}</div><div class="mu">All created groups</div></div><div class="admin-stat"><div class="stat-label">Total students</div><div class="stat-value">${S.students.length}</div><div class="mu">Unique students in the school</div></div><div class="admin-stat"><div class="stat-label">Students assigned</div><div class="stat-value">${assignedCount}</div><div class="mu">Students in at least one group</div></div><div class="admin-stat"><div class="stat-label">Group enrolments</div><div class="stat-value">${totalSeats}</div><div class="mu">Counts multi-group students in each group</div></div></div><div class="page-summary"><span class="summary-chip">Showing <strong>${l.length}</strong> of ${S.groups.length} groups</span></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Group</th><th>Teachers</th><th>Students</th><th>Active</th><th>Classes</th><th class="noprint">Actions</th></tr></thead><tbody>${l.map(g=>{const tn=grpTeachers(g.id);const members=S.students.filter(s=>groupIds(s).includes(g.id));const classCount=S.schedule.filter(x=>x.group_id===g.id).length;return `<tr><td><button class="sec group-name-button" onclick="selectedGroupId='${g.id}';render()"><span>${esc(g.name)}</span><span aria-hidden="true">↗</span></button></td><td>${esc(tn||"—")}</td><td><button class="sec" onclick="selectedGroupId='${g.id}';render()"><span class="group-count-pill">${members.length}</span> View students</button></td><td>${members.filter(s=>s.active).length}</td><td>${classCount}</td><td class="noprint">${eb("groups",g.id)}</td></tr>`}).join("")||`<tr><td colspan="6" class="table-empty">${none(S.groups.length?"no_results":"no_groups")}</td></tr>`}</tbody></table></div>`};
};

  if(payView==="overdue"){
    const l=od.filter(o=>hit(Q.payments,full(o.s),o.s.phone,grpName(o.s)));
    return{head:`${toggle}${searchBox()}<div class="row">${tools("exportOverdue")}</div><div class="mu" style="margin-bottom:8px">${t("overdue_note").replace("{d}",OVERDUE_DAYS)}</div>`,
    body:`<div class="card">${l.map(o=>`<div class="item"><div><b>${esc(full(o.s))}</b> <span class="tag bad">${o.lp===null?t("never_paid"):o.days+" "+t("days_late")}</span>
     <div class="mu">${esc(grpName(o.s))}${o.s.phone?" · 📞 "+tel(o.s.phone):""}</div>${o.lp?`<div class="mu">${t("last_payment")}: ${esc(o.lp)}</div>`:""}</div></div>`).join("")||none(od.length?"no_results":"no_overdue")}</div>`};

  body:`<div class="admin-grid"><div class="admin-stat"><div class="stat-label">${t("total_payments")}</div><div class="stat-value">${money(l.reduce((a,p)=>a+(Number(p.amount)||0),0))}</div></div><div class="admin-stat"><div class="stat-label">Payment records</div><div class="stat-value">${l.length}</div></div><div class="admin-stat"><div class="stat-label">Students who paid</div><div class="stat-value">${new Set(l.map(p=>p.student_id)).size}</div></div></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>${t("student")}</th><th>${t("group")}</th><th>${t("amount")}</th><th>${t("date")}</th><th>${t("note")}</th><th class="noprint">Actions</th></tr></thead><tbody>${l.map(p=>{const s=stu(p.student_id);return `<tr><td>${esc(full(s))}</td><td>${esc(grpName(s))}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.paid_on)}</td><td>${esc(p.note||"")}</td><td class="noprint">${eb("payments",p.id)}</td></tr>`}).join("")||`<tr><td colspan="6">${none(S.payments.length?"no_results":"no_payments")}</td></tr>`}</tbody></table></div><div class="card tbl-wrap"><h3>Paid by student</h3><table class="tbl"><thead><tr><th>${t("student")}</th><th>${t("group")}</th><th>Total paid</th></tr></thead><tbody>${S.students.filter(s=>l.some(p=>p.student_id===s.id)).map(s=>`<tr><td>${esc(full(s))}</td><td>${esc(grpName(s))}</td><td><b>${money(l.filter(p=>p.student_id===s.id).reduce((a,p)=>a+(Number(p.amount)||0),0))}</b></td></tr>`).join("")||`<tr><td colspan="3">No paid students in this view</td></tr>`}</tbody></table></div>`};

V.sessions=()=>{
 const rows=S.teacher_sessions.filter(x=>isAdmin||x.teacher_id===myTeacher).sort((a,b)=>String(b.session_date).localeCompare(String(a.session_date)));
 const earned=rows.reduce((a,x)=>a+(x.session_type==="group"?groupSessionPay(x):(x.taught?(Number(x.rate)||0):0)),0);
 return {head:`${addBtn("teacher_sessions","Record session")}<div class="row noprint"><button class="sec" onclick="printList()">${t("print")}</button></div>`,body:`<div class="admin-grid"><div class="admin-stat"><div class="stat-label">Sessions recorded</div><div class="stat-value">${rows.length}</div></div><div class="admin-stat"><div class="stat-label">Sessions taught</div><div class="stat-value">${rows.filter(x=>x.taught).length}</div></div><div class="admin-stat"><div class="stat-label">Teacher earnings (recorded)</div><div class="stat-value">${money(earned)}</div></div></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Teacher</th><th>Group / Student</th><th>Attendance</th><th>Pay per student</th><th>Students present / Earned</th><th class="noprint">Actions</th></tr></thead><tbody>${rows.map(x=>{const target=x.session_type==="private"?full(stu(x.student_id)):nm(S.groups,x.group_id);return `<tr><td>${esc(x.session_date||"—")}</td><td>${x.session_type==="private"?"Private":"Group"}</td><td>${esc(nm(S.teachers,x.teacher_id))}</td><td>${esc(target)}</td><td><span class="tag ${x.taught?"ok":"bad"}">${x.taught?"Present / taught":"Absent / not taught"}</span></td><td>${money(x.session_type==="group"?(Number(scheduleForAttendance(S.attendance.find(a=>a.group_id===x.group_id&&a.date===x.session_date&&a.present)||{},x.teacher_id)?.teacher_rate)||Number((S.teachers.find(q=>q.id===x.teacher_id)||{}).price_per_session)||0):x.rate)}</td><td><b>${x.session_type==="group"?`${groupSessionAttendanceCount(x)} students · `:""}${money(x.session_type==="group"?groupSessionPay(x):(x.taught?x.rate:0))}</b></td><td class="noprint">${eb("teacher_sessions",x.id)}</td></tr>`}).join("")||`<tr><td colspan="8">No sessions recorded yet</td></tr>`}</tbody></table></div><p class="mu">Group teacher earnings are calculated as: number of students marked present × the scheduled teacher pay per student. Marking a group session absent makes its group-session earnings zero. Private sessions still use the manually entered rate. Attendance must match the scheduled group and class start time.</p>`};
};

V.teachers=()=>{
  const l=S.teachers.filter(x=>hit(Q.teachers,x.name,x.phone,x.login_email));
  return{head:`${addBtn("teachers","add_teacher")}${searchBox()}<div class="row">${tools("exportTeachers")}</div><p class="mu">Assign groups and subjects through Schedule. Teacher pay is calculated from present students × the class's pay-per-attending-student rate.</p>`,
  body:`<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>${t("teacher_name")}</th><th>${t("phone")}</th><th>${t("groups_taught")}</th><th>Subjects</th><th>${t("sessions_week")}</th><th>Default pay / student</th><th>Present attendances</th><th>Earned this month</th><th class="noprint">Actions</th></tr></thead><tbody>${l.map(x=>{const k=tStats(x);const assigned=S.schedule.filter(z=>z.teacher_id===x.id);const groups=[...new Set(assigned.map(z=>nm(S.groups,z.group_id)).filter(n=>n!=="—"))].join(", ")||"Not assigned";const subjects=[...new Set(assigned.map(z=>nm(S.subjects,z.subject_id)).filter(n=>n!=="—"))].join(", ")||"—";const attends=teacherAttendanceRows(x.id).length;return `<tr><td><b>${esc(x.name)}</b>${x.login_email?`<div class="mu">${esc(x.login_email)}</div>`:""}</td><td>${tel(x.phone)||"—"}</td><td>${esc(groups)}</td><td>${esc(subjects)}</td><td>${k.sessions}</td><td>${money(k.price)}</td><td>${attends}</td><td><b>${money(teacherAttendancePay(x))}</b></td><td class="noprint"><button class="sec" onclick="assignTeacherClass('${x.id}')">+ Assign group/class</button> ${eb("teachers",x.id)}</td></tr>`}).join("")||`<tr><td colspan="9">${none(S.teachers.length?"no_results":"none_yet")}</td></tr>`}</tbody></table></div>`};
};

V.reports=()=>{
  const rows=repData(),one=Rs?rows[0]:null;
  const studs=S.students.filter(s=>!Rg||s.group_id===Rg);
  return{head:`<div class="card noprint"><div class="row"><input type="month" value="${Rm}" onchange="Rm=this.value;render()"><select onchange="Rg=this.value;Rs='';render()"><option value="">${t("all_groups")}</option>${grpOpts(Rg)}</select><select onchange="Rs=this.value;render()"><option value="">${t("all_students")}</option>${studs.map(s=>`<option value="${s.id}" ${s.id===Rs?"selected":""}>${esc(full(s))}</option>`).join("")}</select></div>${searchBox()}<div class="row">${tools("exportReport")}</div></div>`,
  body:`<div class="card scrollx"><table class="tbl"><tr><th>${t("student")}</th><th>${t("group")}</th><th>${t("present")}</th><th>${t("absent")}</th><th>${t("total")}</th><th>${t("rate")}</th></tr>
   ${rows.map(r=>`<tr><td>${esc(full(r.s))}</td><td>${esc(grpName(r.s))}</td><td class="ok">${r.p}</td><td class="bad">${r.abs}</td><td>${r.tot}</td><td>${r.rate==null?"—":r.rate+"%"}</td></tr>`).join("")||`<tr><td colspan="6">${t("no_results")}</td></tr>`}</table></div>
   ${one&&one.rs.length?`<div class="card"><b>${esc(full(one.s))}</b>${[...one.rs].sort((a,b)=>(b.date+b.hour).localeCompare(a.date+a.hour)).map(a=>`<div class="item"><span>${esc(a.date)} · ${esc(a.hour)}</span><span class="${a.present?"ok":"bad"}">${t(a.present?"present":"absent")}</span></div>`).join("")}</div>`:""}`};
};

V.finance=()=>{
  const fm=Fm||today().slice(0,7),f=finData(fm);
  return{head:`<div class="card noprint"><div class="row"><input type="month" value="${fm}" onchange="Fm=this.value;render()">${tools("exportFinance")}</div></div>`,
  body:`<div class="fin-grid">
   <div class="admin-stat"><span class="ico">💵</span><div class="stat-label">${t("money_received")}</div><div class="stat-value">${money(f.received)}</div></div>
   <div class="admin-stat"><span class="ico">🧾</span><div class="stat-label">${t("est_teacher_costs")}</div><div class="stat-value">${money(f.cost)}</div></div>
   <div class="admin-stat"><span class="ico">📈</span><div class="stat-label">${t("est_profit")}</div><div class="stat-value ${f.profit<0?"bad":"ok"}" style="color:var(${f.profit<0?"--bad":"--ok"})">${money(f.profit)}</div></div></div>
   <div class="card"><b>${t("per_teacher")}</b>${f.ts.map(x=>`<div class="item"><div>${esc(x.tc.name)}<div class="mu">Group attendance: ${money(x.groupEarned||0)} · Private sessions: ${money(x.privateEarned||0)}</div></div><strong>${money(x.month)}</strong></div>`).join("")||none("none_yet")}</div>
   <div class="mu">Teacher costs are calculated from recorded student attendance × the scheduled teacher pay per attending student. Taught private sessions use their manually entered rate. Profit here is money received minus calculated teacher costs; other expenses are not included.</div><div class="card"><h3>Monthly fee balances · ${esc(fm)}</h3><div class="admin-grid"><div class="admin-stat"><div class="stat-label">Expected monthly fees</div><div class="stat-value">${money(S.students.filter(s=>s.active).reduce((a,s)=>a+(Number(s.monthly_fee)||0),0))}</div></div><div class="admin-stat"><div class="stat-label">Collected this month</div><div class="stat-value">${money(f.received)}</div></div><div class="admin-stat"><div class="stat-label">Outstanding (approx.)</div><div class="stat-value">${money(Math.max(0,S.students.filter(s=>s.active).reduce((a,s)=>a+(Number(s.monthly_fee)||0),0)-f.received))}</div></div></div><div class="mu">Balances are estimates based on each active student’s monthly_fee and payments recorded for the selected month. Other expenses and actual teacher payouts are not included in profit yet.</div></div>`};
};

V.setup=()=>{
  const l=S.subjects.filter(x=>hit(Q.setup,x.name));
  return{head:searchBox(),body:`<div class="card"><b>${t("subjects_classes")}</b><div class="row" style="margin-top:8px"><button class="pri" onclick="openForm('subjects')">+ ${t("add")}</button></div>${l.map(x=>`<div class="item"><span>${esc(x.name)}</span><div>${eb("subjects",x.id)}</div></div>`).join("")||none("none_yet")}</div>`};
};

function render(){
  if(!roleReady){$("main").innerHTML="";return}
  if(!isAdmin&&!myTeacher){$("main").innerHTML=`<div class="card">${t("no_access")}</div>`;return}
  if(!TABS_NOW().includes(tab))tab=TABS_NOW()[0];
  const v=V[tab]();
  $("main").innerHTML=`<div id="printArea"><h2 class="onlyprint">${esc(SCHOOL_NAME)} — ${t(tab)}</h2>`+v.head+`<div id="body">${v.body}</div></div>`;
}
const mark=(sid,present,gid="")=>{const payload={student_id:sid,date:attDate,hour:attHour,present};if(gid)payload.group_id=gid;return sb.from("attendance").upsert(payload,{onConflict:gid?"student_id,date,hour,group_id":"student_id,date,hour"}).then(async r=>{if(r.error)alert(r.error.message+"\nIf this is a group-specific attendance record, run the latest Sesame session migration first.");else await load()})};

setLang(lang);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker registration failed:', err)));
}
</script>
